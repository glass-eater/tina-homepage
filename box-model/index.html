<!DOCTYPE html>
<html>
    <head>
        <title>
        box model
        </title>
        <link rel="stylesheet" href="main.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="">
    </head>
    <body>
        <!-- block elements will take up 100% of the browser window width and will stack vertically on top of each other -->
        <div class= "block">block</div>
        <div class= "block">block</div>
        <div class= "block">block</div>

        <!-- inline elements will only take up as much space as their content requires and will sit next to other inline elements so long as there's space to do so. -->
        <span class= "inline">inline</span>
        <span class= "inline">inline</span>
        <span class= "inline">inline</span>
        <span class= "inline">inline</span>
        <span class= "inline">inline</span>

        <span class= "inline-block">inline-block</span>
        <span class= "inline-block">inline-block</span>
        <span class= "inline-block">inline-block</span>

        <div class= "content-box">content-box</div>
        
        <div class= "border-box">border-box</div>

        <div class= "border-box">border-box
            <div class="block">hey</div>
        </div>

    </body>
    </html>
